# Builds every target (userscript, Chrome, Firefox) and publishes them as the
# "nightly" prerelease, replacing the previous one. GitHub counterpart of
# .forgejo/workflows/nightly.yml.
name: Nightly

on:
  push:
    branches: [main]
    # Only files that change the build (docs etc. don't trigger a nightly).
    paths:
      - src/**
      - assets/**
      - '!assets/badges/**'
      - build.mjs
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/nightly.yml
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes a nightly still in progress.
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          VIBEX_BUILD: ${{ github.run_number }}

      # Deleting the release alone keeps the tag, and `gh release create` reuses
      # an existing tag (ignoring --target), pinning the new one to the old
      # commit. So the tag goes too, even when there's no release to delete.
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" || true
          gh release create nightly \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly $(date -u +%F) (${GITHUB_SHA::7})" \
            --notes "$(cat <<EOF
          Automatic build of $GITHUB_SHA. Replaced by the next nightly.

          Stable versions:

          <a href="https://addons.mozilla.org/addon/vibex-twitter/"><img src="https://raw.githubusercontent.com/jakeayy/vibex/main/assets/badges/firefox-addons.svg" alt="Get the add-on for Firefox" height="58"></a> <a href="https://chromewebstore.google.com/detail/vibex/kejejbjobidanhcljkalddfmmogaaacl"><img src="https://raw.githubusercontent.com/jakeayy/vibex/main/assets/badges/chrome-web-store.png" alt="Available in the Chrome Web Store" height="58"></a> <a href="https://greasyfork.org/scripts/602645-vibex"><img src="https://raw.githubusercontent.com/jakeayy/vibex/main/assets/badges/greasy-fork.svg" alt="Available on Greasy Fork" height="58"></a>

          | File | Install |
          |---|---|
          | \`vibex.user.js\` | Tampermonkey / Violentmonkey |
          | \`vibex-chrome.zip\` | Unzip, then \`chrome://extensions\` → Developer mode → Load unpacked |
          | \`vibex-firefox.zip\` | \`about:debugging\` → Load Temporary Add-on → pick the zip (unsigned, until restart) |
          EOF
          )" \
            dist/vibex.user.js dist/vibex-chrome.zip dist/vibex-firefox.zip
