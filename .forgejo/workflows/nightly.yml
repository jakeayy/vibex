# Builds every target (userscript, Chrome, Firefox) and publishes them as the
# "nightly" prerelease, replacing the previous one.
name: Nightly

on:
  push:
    branches: [main]
    # Only files that change the build (docs etc. don't trigger a nightly).
    paths:
      - src/**
      - assets/**
      - build.mjs
      - package.json
      - package-lock.json
      - tsconfig.json
      - scripts/nightly-release.mjs
      - .forgejo/workflows/nightly.yml
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          VIBEX_BUILD: ${{ github.run_number }}

      - name: Replace the nightly release
        run: node scripts/nightly-release.mjs
        env:
          FORGEJO_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          # Forgejo's automatic token, or a repository secret NIGHTLY_TOKEN with
          # write access to releases if the automatic one isn't allowed to.
          TOKEN: ${{ secrets.NIGHTLY_TOKEN || secrets.FORGEJO_TOKEN }}
